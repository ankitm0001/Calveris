<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calveris Global | Ultra Premium Finance</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Manrope', 'sans-serif'],
                        serif: ['Playfair Display', 'serif'],
                    },
                    colors: {
                        'neu-base': '#e6e9ef', 
                        'neu-dark': '#06100c', 
                        'neu-dark-card': '#111815',
                        'brand-green': '#2a5a4a',
                        'brand-green-light': '#3d7a66',
                        'accent-glow': '#a3c2a3', 
                    },
                    boxShadow: {
                        'clay-card': '20px 20px 40px #c4c6cc, -20px -20px 40px #ffffff',
                        'clay-card-hover': '25px 25px 50px #b8bac0, -25px -25px 50px #ffffff, inset 1px 1px 2px rgba(255,255,255,0.8)',
                        'clay-btn': '8px 8px 16px #c4c6cc, -8px -8px 16px #ffffff',
                        'clay-pressed': 'inset 8px 8px 16px #c4c6cc, inset -8px -8px 16px #ffffff',
                        'clay-nav': '0px 10px 30px rgba(196, 198, 204, 0.4), inset 1px 1px 2px rgba(255,255,255,0.9)',
                        'premium-dark': '0 20px 40px rgba(0,0,0,0.4)',
                    }
                }
            }
        }
    </script>

    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Manrope:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <style>
        body { margin: 0; padding: 0; background-color: #06100c; overflow-x: hidden; }
        
        .perspective-1200 { perspective: 1200px; }
        .preserve-3d { transform-style: preserve-3d; }
        html { scroll-behavior: smooth; }
        button:focus { outline: none; }
        
        .bg-clay {
            background-color: #e6e9ef;
            background-image: radial-gradient(rgba(255,255,255,0.4) 1px, transparent 1px);
            background-size: 20px 20px;
        }

        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #2a5a4a; border-radius: 4px; }
        
        .horizontal-scroll::-webkit-scrollbar { height: 6px; }
        .horizontal-scroll::-webkit-scrollbar-track { background: rgba(0,0,0,0.05); border-radius: 10px; }
        .horizontal-scroll::-webkit-scrollbar-thumb { background: rgba(42, 90, 74, 0.3); border-radius: 10px; }
        .horizontal-scroll::-webkit-scrollbar-thumb:hover { background: rgba(42, 90, 74, 0.6); }

        @keyframes scan {
            0% { transform: translateX(-100%); opacity: 0; }
            50% { opacity: 1; }
            100% { transform: translateX(300%); opacity: 0; }
        }

        @keyframes floatUpDown {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
        }
        
        @keyframes pulseGlow {
            0%, 100% { opacity: 0.1; transform: scale(1) translate(-50%, -50%); }
            50% { opacity: 0.2; transform: scale(1.1) translate(-50%, -50%); }
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const IconLayout = ({size=24, className=""}) => <svg className={className} width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><line x1="3" y1="9" x2="21" y2="9"></line><line x1="9" y1="21" x2="9" y2="9"></line></svg>;
        const IconUsers = ({size=24, className=""}) => <svg className={className} width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87"></path><path d="M16 3.13a4 4 0 0 1 0 7.75"></path></svg>;
        const IconClock = ({size=24, className=""}) => <svg className={className} width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>;
        const IconZap = ({size=24, className=""}) => <svg className={className} width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg>;
        const IconBarChart3 = ({size=24, className=""}) => <svg className={className} width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"><path d="M3 3v18h18"/><rect x="7" y="10" width="4" height="7" rx="1"/><rect x="15" y="4" width="4" height="13" rx="1"/></svg>;
        const IconShield = ({size=24, className=""}) => <svg className={className} width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>;
        const IconArrowRight = ({size=24, className=""}) => <svg className={className} width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>;
        const IconArrowUpRight = ({size=24, className=""}) => <svg className={className} width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="7" y1="17" x2="17" y2="7"></line><polyline points="7 7 17 7 17 17"></polyline></svg>;
        const IconCheck = ({size=24, className=""}) => <svg className={className} width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>;
        const IconMinus = ({size=24, className=""}) => <svg className={className} width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line></svg>;
        const IconVerified = ({size=24, className=""}) => <svg className={className} width={size} height={size} viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10 10-4.5 10-10S17.5 2 12 2zm-1.9 14.7L6 12.6l1.5-1.5 2.6 2.6 6.4-6.4 1.5 1.5-7.9 7.9z"></path></svg>;
        const IconSearch = ({size=24, className=""}) => <svg className={className} width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>;
        const IconDatabase = ({size=24, className=""}) => <svg className={className} width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3"></ellipse><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"></path><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"></path></svg>;

        const SERVICES = [
            { id: '01', name: 'Bookkeeping', desc: 'Accurate and timely recording of all financial transactions, ensuring ledgers are always up to date.', icon: <IconLayout size={28} /> },
            { id: '02', name: 'Payroll', desc: 'Complete payroll processing, compliance management, and timely distribution for your workforce.', icon: <IconUsers size={28} /> },
            { id: '03', name: 'Month-end', desc: 'Streamlined month-end close processes, reconciliation, and structured financial reporting.', icon: <IconClock size={28} /> },
            { id: '04', name: 'Payables & Receivables', desc: 'Efficient management of AP and AR cycles to protect and optimize your cash flow.', icon: <IconZap size={28} /> },
            { id: '05', name: 'Management Reporting', desc: 'Insightful, customized reports tailored for leadership and strategic decision-makers.', icon: <IconBarChart3 size={28} /> },
            { id: '06', name: 'Year-end & Tax Support', desc: 'Meticulous preparation and support for year-end compliance and tax filings.', icon: <IconShield size={28} /> },
        ];

        const generateEmployees = () => {
            const roles = [
                "Senior Accountant", "Financial Controller", "Payroll Specialist", "Audit Lead", 
                "Bookkeeping Expert", "Tax Consultant", "AP/AR Manager", "Strategic Advisor", 
                "Compliance Officer", "Forensic Accountant", "Finance Associate", "Ledger Manager"
            ];
            const names = [
                "Sophie Bennett", "Marcus Chen", "Elena Rodriguez", "James Wilson", "Aisha Patel", 
                "David Kim", "Sarah Jenkins", "Tom Baker", "Emma Thompson", "Lucas Silva", 
                "Mia Wong", "Omar Tariq", "Isabella Rossi", "William Chang", "Sophia Martinez", 
                "Liam O'Connor", "Charlotte Dubois", "Noah Schmidt", "Amelia Singh", "Ethan Taylor", 
                "Harper Lewis", "Alexander White", "Evelyn Hall", "Daniel Young", "Abigail King", 
                "Matthew Wright", "Emily Lopez", "Joseph Hill", "Elizabeth Scott", "Samuel Green"
            ];
            const descriptions = [
                "Expert in corporate tax and strategic financial planning.",
                "Specializes in streamlining month-end processes.",
                "Ensuring compliance and smooth operations for workforces.",
                "Meticulous attention to detail through rigorous review.",
                "Keeping ledgers immaculate for real-time reporting.",
                "Navigating complex tax landscapes to optimize liabilities.",
                "Managing cash flow efficiently to fuel business operations.",
                "Providing high-level insights for long-term health.",
                "Dedicated to maintaining strict regulatory adherence.",
                "Uncovering financial anomalies and ensuring integrity.",
                "Supporting day-to-day transaction processing.",
                "Overseeing comprehensive ledger reconciliations."
            ];

            const portraitUrls = [
                "https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=500&h=600&fit=crop",
                "https://images.unsplash.com/photo-1506794778202-cad84cf45f1d?w=500&h=600&fit=crop",
                "https://images.unsplash.com/photo-1531746020798-e6953c6e8e04?w=500&h=600&fit=crop",
                "https://images.unsplash.com/photo-1472099645785-5658abf4ff4e?w=500&h=600&fit=crop",
                "https://images.unsplash.com/photo-1573496359142-b8d87734a5a2?w=500&h=600&fit=crop",
                "https://images.unsplash.com/photo-1519085360753-af0119f7cbe7?w=500&h=600&fit=crop",
                "https://images.unsplash.com/photo-1580489944761-15a19d654956?w=500&h=600&fit=crop",
                "https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=500&h=600&fit=crop",
                "https://images.unsplash.com/photo-1438761681033-6461ffad8d80?w=500&h=600&fit=crop",
                "https://images.unsplash.com/photo-1500648767791-00dcc994a43e?w=500&h=600&fit=crop",
                "https://images.unsplash.com/photo-1607990281513-2c110a25bd8c?w=500&h=600&fit=crop",
                "https://images.unsplash.com/photo-1589156280159-27698a70f29e?w=500&h=600&fit=crop"
            ];

            return names.map((name, index) => {
                return {
                    id: index + 1,
                    name: name,
                    role: roles[index % roles.length],
                    desc: descriptions[index % descriptions.length],
                    img: portraitUrls[index % portraitUrls.length]
                };
            });
        };

        const EMPLOYEES = generateEmployees();

        const ClayCard = ({ children, className = "", index = 0, hoverable = true }) => {
            return (
                <div 
                    className={`relative rounded-[2.5rem] bg-neu-base p-10 transition-all duration-500 ease-out flex flex-col ${hoverable ? 'shadow-clay-card hover:shadow-clay-card-hover hover:-translate-y-2' : 'shadow-clay-card'} ${className}`}
                    style={{ animationDelay: `${index * 100}ms` }}
                >
                    <div className="relative z-10 w-full h-full">
                        {children}
                    </div>
                </div>
            );
        };

        const FadeIn = ({ children, delay = 0, className = "", direction = "up" }) => {
            const domRef = useRef();
            const [isVisible, setVisible] = useState(false);

            useEffect(() => {
                const observer = new IntersectionObserver(entries => {
                    if (entries[0].isIntersecting) {
                        setVisible(true);
                        observer.disconnect();
                    }
                }, { threshold: 0.1, rootMargin: "0px 0px -50px 0px" });
                
                if (domRef.current) observer.observe(domRef.current);
                return () => observer.disconnect();
            }, []);

            const translateMap = {
                up: 'translate-y-12', down: '-translate-y-12',
                left: 'translate-x-12', right: '-translate-x-12', none: 'translate-y-0'
            };

            return (
                <div
                    ref={domRef}
                    className={`transition-all duration-[1200ms] ease-[cubic-bezier(0.16,1,0.3,1)] will-change-transform ${
                        isVisible ? 'opacity-100 translate-y-0 translate-x-0' : `opacity-0 ${translateMap[direction]}`
                    } ${className}`}
                    style={{ transitionDelay: `${delay}ms` }}
                >
                    {children}
                </div>
            );
        };

        const PremiumInteractiveDeck = () => {
            const [hoverIdx, setHoverIdx] = useState(null);
            
            const cards = [
                { id: 4, label: "2024", title: "Strategic Forecast", subtitle: "Predictive financial modeling", icon: <IconBarChart3 size={24}/> },
                { id: 3, label: "2023", title: "Tax & Compliance", subtitle: "Finalized year-end filings", icon: <IconShield size={24}/> },
                { id: 2, label: "Q3", title: "Month-End Close", subtitle: "Comprehensive reconciliation", icon: <IconClock size={24}/> },
                { id: 1, label: "Live", title: "Ledger Engine", subtitle: "Real-time sync & visibility", icon: <IconDatabase size={24}/> },
            ];

            return (
                <div className="relative w-full max-w-[500px] h-[650px] flex items-center justify-center pointer-events-auto z-50 mx-auto lg:ml-auto">
                    
                    {/* Background Ambient Pulse */}
                    <div className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[300px] h-[300px] bg-[#4ade80] rounded-full mix-blend-screen opacity-10 blur-[100px] pointer-events-none animate-[pulseGlow_6s_ease-in-out_infinite]"></div>

                    {/* 
                      The Ledger Array:
                      Uses pure 2D transforms (translateY, translateX) to create a flawless, stable 
                      cascading stack that feels 3D but eliminates all browser hitbox glitching.
                    */}
                    <div className="relative w-full h-[450px] animate-[floatUpDown_8s_ease-in-out_infinite] flex flex-col justify-start mt-20">
                        {cards.map((card, i) => {
                            const isHovered = hoverIdx === i;
                            const isAnyHovered = hoverIdx !== null;
                            
                            // Staggered vertical base positioning
                            const baseTop = i * 85; 
                            const zIndex = isHovered ? 50 : 10 - i;
                            
                            // Transform logic for pulling active card out and pushing others away
                            let translateY = baseTop;
                            let translateX = 0;
                            let scale = 1 - (i * 0.05); // Deeper cards are visually smaller
                            
                            if (isAnyHovered) {
                                if (isHovered) {
                                    translateX = -40; // Pull heavily to the left to feature it
                                    translateY = baseTop - 15; // Lift up slightly
                                    scale = 1.05; // Enlarge
                                } else if (i < hoverIdx) {
                                    translateY = baseTop - 50; // Push above cards up
                                    translateX = 20; // Push them slightly right
                                } else {
                                    translateY = baseTop + 50; // Push below cards down
                                    translateX = 20; // Push them slightly right
                                }
                            }

                            return (
                                <div
                                    key={card.id}
                                    onMouseEnter={() => setHoverIdx(i)}
                                    onMouseLeave={() => setHoverIdx(null)}
                                    className="absolute left-0 right-0 cursor-pointer transition-all duration-[600ms] ease-[cubic-bezier(0.16,1,0.3,1)]"
                                    style={{
                                        top: '0px',
                                        zIndex: zIndex,
                                        transform: `translateY(${translateY}px) translateX(${translateX}px) scale(${scale})`,
                                        opacity: isAnyHovered && !isHovered ? 0.3 : 1,
                                        filter: isAnyHovered && !isHovered ? 'blur(3px)' : 'blur(0px)',
                                        transformOrigin: 'center top'
                                    }}
                                >
                                    {/* Ultra-Premium Glassmorphic Card */}
                                    <div className={`relative w-[90%] sm:w-[420px] mx-auto rounded-[2rem] border overflow-hidden backdrop-blur-2xl p-8 transition-all duration-[600ms]
                                        ${isHovered 
                                            ? 'bg-gradient-to-br from-[#153225]/95 to-[#0a1812]/98 border-[#4ade80]/60 shadow-[0_30px_60px_rgba(0,0,0,0.8),0_0_40px_rgba(74,222,128,0.25)]' 
                                            : 'bg-gradient-to-br from-[#112119]/90 to-[#060c09]/95 border-white/10 shadow-[0_15px_30px_rgba(0,0,0,0.7)]'
                                        }
                                    `}>
                                        {/* Glowing top scanline */}
                                        <div className={`absolute top-0 left-0 w-full h-[2px] transition-all duration-700 ${isHovered ? 'bg-gradient-to-r from-transparent via-[#4ade80] to-transparent shadow-[0_0_20px_#4ade80] opacity-100' : 'bg-white/20 opacity-30'}`}></div>
                                        
                                        <div className="flex items-start gap-6 relative z-10">
                                            <div className={`p-4 rounded-2xl flex items-center justify-center transition-all duration-500 border ${isHovered ? 'bg-[#4ade80]/15 text-[#4ade80] border-[#4ade80]/40 shadow-[inset_0_0_20px_rgba(74,222,128,0.25)] scale-110' : 'bg-white/5 text-[#a3c2a3] border-white/10'}`}>
                                                {card.icon}
                                            </div>
                                            <div>
                                                <div className="flex items-center gap-2 mb-2">
                                                    <span className={`text-[11px] font-bold tracking-[0.2em] uppercase transition-colors duration-500 ${isHovered ? 'text-[#4ade80]' : 'text-white/40'}`}>{card.label}</span>
                                                </div>
                                                <h3 className={`text-2xl font-serif mb-1.5 transition-colors duration-500 ${isHovered ? 'text-white' : 'text-white/80'}`}>{card.title}</h3>
                                                <p className={`text-sm font-light leading-relaxed transition-colors duration-500 ${isHovered ? 'text-[#e5e7eb]' : 'text-[#6b7280]'}`}>{card.subtitle}</p>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            )
                        })}
                    </div>
                </div>
            );
        };

        const EmployeeCard = ({ employee }) => (
            <div className="group relative rounded-[2rem] bg-[#171a19] p-3 flex flex-col h-[420px] shadow-[0_8px_30px_rgb(0,0,0,0.12)] border border-white/5 overflow-hidden cursor-pointer transition-colors duration-300 hover:bg-[#1c201e]">
                <div className="relative w-full rounded-[1.5rem] overflow-hidden transition-[height] duration-500 ease-[cubic-bezier(0.4,0,0.2,1)] h-[310px] group-hover:h-[220px] bg-[#2a302d] shrink-0">
                    <img 
                        src={employee.img} 
                        alt={employee.name}
                        className="w-full h-full object-cover transition-transform duration-700 group-hover:scale-105"
                        loading="lazy"
                    />
                    <div className="absolute inset-0 bg-gradient-to-t from-black/30 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-500"></div>
                </div>
                
                <div className="px-2 pt-4 flex flex-col flex-grow justify-start">
                    <div className="flex items-center gap-2 mb-1">
                        <h3 className="text-xl text-white font-sans font-medium tracking-wide">{employee.name}</h3>
                        <IconVerified size={18} className="text-[#10b981]" />
                    </div>
                    <div className="text-[#9ca3af] text-sm font-light">
                        {employee.role}
                    </div>
                    
                    <div className="grid grid-rows-[0fr] group-hover:grid-rows-[1fr] transition-[grid-template-rows] duration-500 ease-[cubic-bezier(0.4,0,0.2,1)]">
                        <div className="overflow-hidden">
                            <p className="text-[#d1d5db] text-sm leading-relaxed font-light pt-3 opacity-0 group-hover:opacity-100 transition-all duration-500 delay-75 transform translate-y-2 group-hover:translate-y-0">
                                {employee.desc}
                            </p>
                        </div>
                    </div>
                </div>
            </div>
        );

        const EmployeeTeamScroll = ({ navigateToTeam }) => {
            const scrollContainerRef = useRef(null);

            const scroll = (direction) => {
                if (scrollContainerRef.current) {
                    const scrollAmount = direction === 'left' ? -350 : 350;
                    scrollContainerRef.current.scrollBy({ left: scrollAmount, behavior: 'smooth' });
                }
            };

            const previewEmployees = EMPLOYEES.slice(0, 8);

            return (
                <section className="relative py-32 bg-clay overflow-hidden z-10 border-b border-black/5">
                    <div className="w-full max-w-[120rem] mx-auto px-6 md:px-12 xl:px-20 relative">
                        <div className="flex flex-col md:flex-row justify-between items-end mb-16 gap-6">
                            <FadeIn>
                                <div className="flex items-center gap-3 text-[10px] tracking-[0.2em] uppercase text-[#6b7280] mb-4 font-bold">
                                    <span className="w-2 h-2 bg-[#2a5a4a] rounded-sm shadow-[inset_1px_1px_2px_rgba(255,255,255,0.5)] rotate-45"></span>
                                    Elite Talent
                                </div>
                                <h2 className="text-4xl md:text-5xl text-[#0d1b16] leading-[1.1] font-serif max-w-2xl drop-shadow-sm">
                                    The accounting experts powering your growth.
                                </h2>
                            </FadeIn>
                            
                            <FadeIn delay={200} className="flex gap-4 items-center">
                                <button 
                                    onClick={() => scroll('left')}
                                    className="w-12 h-12 rounded-full bg-neu-base shadow-clay-btn flex items-center justify-center text-[#2a5a4a] hover:shadow-clay-pressed transition-all active:scale-95"
                                    aria-label="Scroll left"
                                >
                                    <IconArrowRight size={20} className="rotate-180" />
                                </button>
                                <button 
                                    onClick={() => scroll('right')}
                                    className="w-12 h-12 rounded-full bg-neu-base shadow-clay-btn flex items-center justify-center text-[#2a5a4a] hover:shadow-clay-pressed transition-all active:scale-95"
                                    aria-label="Scroll right"
                                >
                                    <IconArrowRight size={20} />
                                </button>
                                <button 
                                    onClick={navigateToTeam}
                                    className="hidden md:flex ml-4 text-[10px] font-bold tracking-[0.2em] uppercase px-6 py-3 border border-[#2a5a4a]/20 text-[#2a5a4a] rounded-full hover:bg-[#2a5a4a] hover:text-white transition-all"
                                >
                                    View Full Team
                                </button>
                            </FadeIn>
                        </div>

                        <FadeIn delay={300}>
                            <div 
                                ref={scrollContainerRef}
                                className="flex overflow-x-auto gap-8 pb-12 pt-4 horizontal-scroll snap-x snap-mandatory px-4 -mx-4"
                            >
                                {previewEmployees.map((employee) => (
                                    <div key={employee.id} className="flex-none w-[300px] sm:w-[340px] snap-center">
                                        <EmployeeCard employee={employee} />
                                    </div>
